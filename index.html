<div class="panel small" style="margin-top:10px"><div class="row"><strong>Specimen collection</strong><button id="x3-five">Discover 5</button></div><div class="gallery" id="x3-gallery" style="margin-top:9px"></div></div>
<div class="panel small" style="margin-top:10px"><div class="row"><strong>Genome inspector</strong><div><button data-inspect="a">A</button><button data-inspect="b">B</button><button data-inspect="c">Child</button></div></div><div class="muted" id="x3-detail"></div><pre id="x3-json"></pre></div><div id="x3-log"></div>
</div><script>
(function(){'use strict';
const root=document.getElementById('x3');if(!root)return;
const $=id=>root.querySelector('#x3-'+id);
const PI=Math.PI,TAU=2*PI,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),mix=(a,b,t)=>a+(b-a)*t;
const V=(x=0,y=0,z=0)=>[x,y,z],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let s=Math.hypot(...a)||1;return mul(a,1/s)};
const cp=o=>JSON.parse(JSON.stringify(o));const seed=()=>Math.floor(Math.random()*4294967295);
function hash(){let h=2166136261;for(const n of arguments){h=Math.imul(h^(Number(n)>>>0),16777619);h^=h>>>13;}return h>>>0;}
function rng(s){let a=s>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}}
const between=(r,a,b)=>mix(a,b,r()),pick=(r,a)=>a[Math.floor(r()*a.length)];let count=0;
function module(id,type,r){return{id,type,length:between(r,.27,.95),width:between(r,.26,.89),curve:between(r,-.8,.8),twist:between(r,-.9,.9),lobes:Math.round(between(r,4,10)),waves:between(r,.05,.55)};}
function wild(){let r=rng(seed());const architecture=pick(r,['upright','radial','creeping','clustered']);const profiles={
 upright:{basal:between(r,0,.2),creep:between(r,0,.15),cluster:between(r,0,.3)},
 radial:{basal:between(r,.72,1),creep:between(r,0,.2),cluster:between(r,.2,.65)},
 creeping:{basal:between(r,.28,.72),creep:between(r,.72,1),cluster:between(r,0,.6)},
 clustered:{basal:between(r,.4,.9),creep:between(r,.05,.4),cluster:between(r,.75,1)}
};const genome={version:5,development:{height:between(r,.38,1.4),spread:between(r,.15,1.25),lean:between(r,-.7,.7),radial:between(r,.1,1),twirl:between(r,-.8,.8),...profiles[architecture]},nodes:[module(1,'axis',r),module(2,pick(r,['leaf','flower','bulb']),r),module(3,pick(r,['leaf','flower','bulb']),r)],links:[{id:10,from:1,to:1,site:'side',density:between(r,.2,.65),angle:between(r,.2,.9),limit:Math.round(between(r,1,3))},{id:11,from:1,to:2,site:pick(r,['tip','side']),density:between(r,.3,.9),angle:between(r,.15,.8),limit:5},{id:12,from:1,to:3,site:pick(r,['tip','side']),density:between(r,.3,.9),angle:between(r,.2,.8),limit:5}],palette:(()=>{const hue=r(),shift=between(r,.22,.49)*(r()<.5?-1:1);
 return{hue,leafHue:(hue+shift*.35+1)%1,flowerHue:(hue+shift+1)%1,bulbHue:(hue+shift*.78+.18+1)%1,offset:between(r,.14,.32),accent:(hue+shift*.65+.12+1)%1,glow:between(r,.15,.7)};})(),variation:{scale:between(r,.05,.15),angle:between(r,.04,.18),shape:between(r,.04,.18),color:between(r,.02,.065)}};

 // These links are part of the inheritable developmental graph.
 if(r()<.72){
  const from=pick(r,[2,3]),to=pick(r,[1,2,3]);
  genome.links.push({id:13,from,to,site:'tip',density:between(r,.18,.62),angle:between(r,.16,.74),limit:4});
 }
 return genome;}
function specimen(g,s=seed()){return{id:++count,genome:cp(g),seed:s,cache:null};}
function mutate(g,p,r=rng(seed())){for(const n of g.nodes){for(const k of ['length','width','curve','twist','waves'])if(r()<.5)n[k]=clamp(n[k]+between(r,-p,p),k==='curve'||k==='twist'?-1:0,1);if(r()<p*.4)n.lobes=clamp(n.lobes+(r()<.5?-1:1),3,12);}for(const l of g.links){if(r()<.5)l.angle=clamp(l.angle+between(r,-p,p),0,1);if(r()<.5)l.density=clamp(l.density+between(r,-p,p),.12,1);if(r()<p*.3)l.site=l.site==='tip'?'side':'tip';if(r()<p*.18&&g.nodes.length>2){const possibilities=g.nodes.filter(n=>n.id!==l.from);if(possibilities.length)l.to=pick(r,possibilities).id;}}for(const k in g.development)if(r()<.7)g.development[k]=clamp(g.development[k]+between(r,-p,p),k==='lean'||k==='twirl'?-1:0,1.4);for(const k in g.palette)if(r()<.5)g.palette[k]=(g.palette[k]+between(r,-p*.4,p*.4)+1)%1;if(r()<p*.42 && g.nodes.length>2 && g.links.length<12){
 const organSources=g.nodes.filter(n=>n.type!=='axis');
 const from=pick(r,organSources).id,to=pick(r,g.nodes).id;
 const id=Math.max(...g.links.map(l=>l.id))+1;
 g.links.push({id,from,to,site:'tip',density:between(r,.14,.58),angle:between(r,.1,.8),limit:4});
 }
 if(r()<p*.8&&g.nodes.length<7){const id=Math.max(...g.nodes.map(x=>x.id))+1;g.nodes.push(module(id,pick(r,['leaf','flower','bulb']),r));g.links.push({id:20+id,from:1,to:id,site:pick(r,['tip','side']),density:between(r,.2,.8),angle:between(r,.2,.9),limit:5});}return g;}
function breed(A,B,p){const r=rng(seed()),a=A.genome,b=B.genome,g={version:5,development:{},nodes:[],links:[],palette:{},variation:{}};for(const k of new Set([...Object.keys(a.development),...Object.keys(b.development),'basal','creep','cluster'])){const x=a.development[k]??0,y=b.development[k]??0;g.development[k]=r()<.18?(r()<.5?x:y):mix(x,y,between(r,.1,.9));}for(const id of new Set([...a.nodes,...b.nodes].map(n=>n.id))){const x=a.nodes.find(n=>n.id===id),y=b.nodes.find(n=>n.id===id);if(!x||!y){if(r()<.72)g.nodes.push(cp(x||y));continue;}let n=cp(r()<.5?x:y);for(const k of ['length','width','curve','twist','waves'])n[k]=r()<.25?(r()<.5?x[k]:y[k]):mix(x[k],y[k],between(r,.15,.85));g.nodes.push(n);}if(!g.nodes.find(n=>n.id===1))g.nodes.push(cp(a.nodes[0]));for(const id of new Set([...a.links,...b.links].map(n=>n.id))){const x=a.links.find(n=>n.id===id),y=b.links.find(n=>n.id===id);if(!x||!y){if(r()<.6)g.links.push(cp(x||y));continue;}let l=cp(r()<.5?x:y);l.angle=mix(x.angle,y.angle,between(r,.15,.85));l.density=mix(x.density,y.density,between(r,.15,.85));g.links.push(l);}g.links=g.links.filter(l=>g.nodes.some(n=>n.id===l.from)&&g.nodes.some(n=>n.id===l.to));for(const cat of ['palette','variation'])for(const k of new Set([...Object.keys(a[cat]),...Object.keys(b[cat])])){
 let x=a[cat][k],y=b[cat][k];
 if(x===undefined)x=(k==='flowerHue'||k==='bulbHue'||k==='leafHue')?a.palette.hue:0;
 if(y===undefined)y=(k==='flowerHue'||k==='bulbHue'||k==='leafHue')?b.palette.hue:0;
 if(cat==='palette'&&['hue','accent','leafHue','flowerHue','bulbHue'].includes(k)){
  const d=((y-x+1.5)%1)-.5;
  g[cat][k]=(x+d*between(r,.12,.88)+1)%1;
 }else g[cat][k]=mix(x,y,between(r,.12,.88));
}if(r()<.8)mutate(g,p,r);return specimen(g);}
function frame(dir){let u=norm(cross(dir,Math.abs(dir[1])>.91?V(0,0,1):V(0,1,0)));return[u,norm(cross(u,dir))];}
function rotateAround(v,axis,ang){return add(add(mul(v,Math.cos(ang)),mul(cross(axis,v),Math.sin(ang))),mul(axis,dot(axis,v)*(1-Math.cos(ang))));}
function generate(sp){let g=sp.genome,nodes=new Map(g.nodes.map(n=>[n.id,n])),parts=[],visits=0;
 function grow(id,origin,dir,scale,depth,path){if(visits++>130||depth>5||scale<.075)return;let n=nodes.get(id);if(!n)return;let r=rng(hash(sp.seed,path,id)),v=g.variation,d=g.development,sc=scale*(1+between(r,-v.scale,v.scale));dir=norm(add(dir,V(between(r,-v.angle,v.angle),between(r,-v.angle,v.angle),between(r,-v.angle,v.angle))));let len=(n.type==='axis'?1.5+n.length*2:1+n.length*2)*sc*(n.type==='axis'?d.height:1),width=(.15+n.width*.65)*sc;
 let bend=between(r,-v.shape,v.shape)+n.curve;let [u,w]=frame(dir),e=norm(add(add(dir,mul(u,bend*.36)),mul(w,n.twist*.17)));
 // Ground is an invisible world-space boundary (y=0), not a rendered object.
  // Resolve trajectories before developing descendants, including the shape's
  // full length; the renderer also clips any curved/volumetric surface crossing it.
  const start=V(origin[0],Math.max(0,origin[1]),origin[2]);
  const tipY=start[1]+e[1]*len;
  if(tipY<Math.max(.02,width*.14)){
    const minUp=(Math.max(.02,width*.14)-start[1])/Math.max(len,.001);
    // Raise the direction while preserving the horizontal direction as much as possible.
    e=norm(V(e[0],Math.max(e[1],minUp+.045),e[2]));
    if(start[1]+e[1]*len<.015)e=norm(V(e[0]*.85,.25,e[2]*.85));
  }
  let part={id,type:n.type,pos:start,dir:e,len,width,curve:bend,lobes:n.lobes,waves:n.waves,twist:n.twist,path,depth};parts.push(part);const isAxis=n.type==='axis';
 for(const link of g.links.filter(l=>l.from===id)){if(depth>=link.limit+1)continue;let rr=rng(hash(sp.seed,path,link.id));let num=link.site==='tip'?Math.max(1,Math.round(link.density*1.8)):Math.max(1,Math.round(1+link.density*3));
 if(!isAxis)num=Math.min(2,num);for(let i=0;i<num;i++){let t=link.site==='tip'?between(rr,.85,1):clamp((i+.45+rr()*.2)/num,.08,.96);let at=add(start,mul(e,len*t*(isAxis?1:(n.type==='flower'?.6:.82))));let az=i*2.39996+rr()*d.radial*1.1+depth*d.twirl,rad=norm(add(mul(u,Math.cos(az)),mul(w,Math.sin(az))));let tilt=link.to===1?.3+link.angle*d.spread*.8:.2+link.angle*1.25;
 if(!isAxis)tilt*=.7;let next=norm(add(mul(e,Math.cos(tilt)),mul(rad,Math.sin(tilt))));if(depth===0&&link.to===1)next=norm(add(next,V(d.lean*.3,0,0)));

 if(link.to===1 && d.creep>0 && rr()<d.creep*.82){
   const floorBias=clamp((1.1-at[1])*.65,0,1);
   next=norm(V(next[0],mix(next[1],.08+Math.max(0,next[1])*.12,floorBias*d.creep),next[2]));
 }
 // Compact clustered plants produce repeated organs close together at the tips.
 const childScale=sc*(link.to===1?.71:.76)*(isAxis?1:.51)*between(rr,.86,1.12);
 grow(link.to,at,next,childScale,depth+1,hash(path,link.id,i));
 if(isAxis && link.to!==1 && d.cluster>0 && rr()<d.cluster*.75){
   const copies=Math.round(1+d.cluster*2);
   for(let j=0;j<copies;j++){
     const spin=(j+1)*2.39996+rr()*.3;
     const near=add(at,mul(rad,(j+1)*.11*childScale));
     const flowerDir=norm(add(mul(next,.78),mul(norm(add(mul(u,Math.cos(spin)),mul(w,Math.sin(spin)))),.36)));
     grow(link.to,near,flowerDir,childScale*between(rr,.65,.9),depth+1,hash(path,link.id,i,200+j));
   }
 }}}
 }
 // The genome determines the number and orientation of primary shoots.
 // Every shoot starts at or above the invisible y=0 ground boundary.
 const d=g.development,rootR=rng(hash(sp.seed,912)),basal=d.basal??0,creep=d.creep??0;
 const primaryCount=Math.min(7,1+Math.round(basal*5));
 for(let i=0;i<primaryCount;i++){
   const theta=i*2.399963+rootR()*.25;
   const radial=V(Math.cos(theta),0,Math.sin(theta));
   const opening=primaryCount===1?0:basal*(.35+creep*.7);
   const upward=norm(V(d.lean,1,0));
   const direction=norm(add(mul(upward,1-opening),mul(radial,opening)));
   const start=i===0?V(0,0,0):V(Math.cos(theta)*.09,0,Math.sin(theta)*.09);
   grow(1,start,direction,primaryCount===1?1:between(rootR,.66,.96),0,hash(sp.seed,3,i));
 }
 let triangles=[],lines=[];
 // Clip every above-ground triangle against the invisible horizontal plane y=0.
 // This includes thick stems, curved leaves, flowers and bulbs.
 function face(a,b,c,h,s,l,alpha=1,gradient=null){
  const vertices=[a,b,c],clipped=[];
  for(let i=0;i<3;i++){
    const current=vertices[i],previous=vertices[(i+2)%3];
    const inside=current[1]>=0,previousInside=previous[1]>=0;
    if(inside!==previousInside){
      const t=previous[1]/(previous[1]-current[1]);
      clipped.push(add(previous,mul(sub(current,previous),t)));
    }
    if(inside)clipped.push(current);
  }
  for(let i=1;i+1<clipped.length;i++){
    const a=clipped[0],b=clipped[i],c=clipped[i+1];
    triangles.push({pts:[a,b,c],h,s,l,alpha,gradient,normal:norm(cross(sub(b,a),sub(c,a)))});
  }
 }
 function band(p,steps,sides,startR,endR){let direction=p.dir,[u,w]=frame(direction),rings=[];for(let i=0;i<=steps;i++){let t=i/steps;let center=add(add(p.pos,mul(direction,p.len*t)),mul(u,Math.sin(t*PI)*p.curve*p.len*.12));let radius=mix(startR,endR,t);let ring=[];for(let j=0;j<sides;j++){let a=TAU*j/sides,rad=add(mul(u,Math.cos(a)),mul(w,Math.sin(a)));ring.push(add(center,mul(rad,radius)));}rings.push(ring);if(i)for(let j=0;j<sides;j++){let k=(j+1)%sides,prev=rings[i-1],curr=rings[i];const stemGradient={from:p.pos,to:add(p.pos,mul(p.dir,p.len)),colors:[[g.palette.hue,.76,.23],[g.palette.hue+g.palette.offset*.33,.9,.43],[g.palette.hue+g.palette.offset*.6,.97,.61]]};
 face(prev[j],prev[k],curr[k],g.palette.hue,.75,.38,1,stemGradient);face(prev[j],curr[k],curr[j],g.palette.hue,.75,.38,1,stemGradient);}}}
 for(const p of parts){if(p.type==='axis'){band(p,5,7,p.width*.22,p.width*.035);lines.push([p.pos,add(p.pos,mul(p.dir,p.len)),'axis']);continue;}
 let [u,w]=frame(p.dir),palette=g.palette;
 const h=p.type==='leaf'?(palette.leafHue??palette.hue):p.type==='flower'?(palette.flowerHue??palette.hue):(palette.bulbHue??palette.hue);
 let r=rng(hash(sp.seed,p.path,123)),localHue=h+between(r,-g.variation.color,g.variation.color);
 if(p.type==='leaf'){
 let strips=9,edge=[];for(let i=0;i<=strips;i++){let t=i/strips,sin=Math.pow(Math.sin(PI*t),.72),wid=p.width*sin*(1+.14*Math.sin(t*TAU*p.lobes*.35)*p.waves);let center=add(add(p.pos,mul(p.dir,p.len*t)),add(mul(u,p.curve*p.len*.12*Math.sin(PI*t)),mul(w,p.twist*p.len*.1*t*t)));let twist=rotateAround(u,p.dir,p.twist*t*1.3);edge.push([add(center,mul(twist,wid)),sub(center,mul(twist,wid))]);if(i){let a=edge[i-1],b=edge[i];const leafGradient={from:p.pos,to:add(p.pos,mul(p.dir,p.len)),colors:[[localHue,.91,.25],[localHue+g.palette.offset*.3,.96,.47],[localHue+g.palette.offset,.98,.73]]};
 face(a[0],a[1],b[1],localHue,.88,.45+sin*.12,1,leafGradient);face(a[0],b[1],b[0],localHue,.88,.45+sin*.12,1,leafGradient);}}lines.push([p.pos,add(p.pos,mul(p.dir,p.len)),'leaf']);
 }else if(p.type==='flower'){
 const n=p.lobes,plen=p.len*.62;let base=add(p.pos,mul(p.dir,p.len*.08));for(let j=0;j<n;j++){let a=j*TAU/n,pv=add(mul(u,Math.cos(a)),mul(w,Math.sin(a))),ort=norm(cross(pv,p.dir));let rings=[];for(let k=0;k<=6;k++){let t=k/6,center=add(add(base,mul(pv,plen*t)),mul(p.dir,plen*(.25*Math.sin(t*PI)+p.curve*.1*t)));let ww=p.width*.42*Math.sin(t*PI);rings.push([add(center,mul(ort,ww)),sub(center,mul(ort,ww))]);if(k){let x=rings[k-1],y=rings[k];const petalGradient={from:base,to:add(base,mul(pv,plen)),colors:[[localHue,.94,.29],[localHue+g.palette.offset*.36,.99,.57],[localHue+g.palette.offset,.97,.79]]};

function hue(h,s,l,a=1){return 'hsla('+(((h%1)+1)%1)*360+','+Math.round(s*100)+'%,'+Math.round(l*100)+'%,'+a+')';}
const camera={yaw:.55,pitch:.18},state={a:null,b:null,c:null,gallery:[],mode:'solid',inspect:'c'};
function draw(canvas,sp,mode=state.mode,yaw=camera.yaw,pitch=camera.pitch){if(!sp.cache)sp.cache=generate(sp);let mesh=sp.cache,ctx=canvas.getContext('2d');if(!ctx)return;let W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.5,H*.55,10,W*.5,H*.55,H*.75);bg.addColorStop(0,'#193441');bg.addColorStop(1,'#081321');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

function refreshOne(k){const sp=state[k],info=draw($(k),sp);$(k+'id').textContent='#'+sp.id;const d=sp.genome.development;const style=(d.creep??0)>.65?'creeping':(d.cluster??0)>.7?'clustered':(d.basal??0)>.6?'radial':'upright';$(k+'stats').textContent=style+' · '+info.parts+' structures · '+info.faces+' triangles · seed '+sp.seed;}

on('aw',()=>{state.a=specimen(wild());refresh();});on('bw',()=>{state.b=specimen(wild());refresh();});for(const k of ['a','b','c'])on(k+'v',()=>{state[k].seed=seed();state[k].cache=null;refresh();$('message').textContent='Same genome, new individual development.';});on('breed',()=>{state.c=breed(state.a,state.b,Number($('rate').value)/100);refresh();$('message').textContent='Three-dimensional hybrid generated.';});on('mut',()=>{state.c=specimen(mutate(cp(state.c.genome),Number($('rate').value)/100));refresh();});on('save',()=>save(state.c));on('five',()=>{for(let i=0;i<5;i++)save(specimen(wild()));});$('rate').oninput=()=>$('rateval').textContent=$('rate').value+'%';$('mode').onchange=()=>safe(()=>{state.mode=$('mode').value;refresh();});$('angle').onchange=()=>safe(()=>{const v=$('angle').value;if(v==='side'){camera.yaw=0;camera.pitch=0;}if(v==='top'){camera.yaw=.3;camera.pitch=1.4;}refresh();});root.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>safe(()=>{state.inspect=b.dataset.inspect;inspect();}));
for(const k of ['a','b','c']){const canvas=$(k);let down=null;canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,yaw:camera.yaw,pitch:camera.pitch};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!down)return;camera.yaw=down.yaw+(e.clientX-down.x)*.012;camera.pitch=clamp(down.pitch+(e.clientY-down.y)*.008,-1.45,1.45);$('angle').value='free';safe(()=>{for(const x of ['a','b','c'])draw($(x),state[x]);});});canvas.addEventListener('pointerup',()=>down=null);canvas.addEventListener('pointercancel',()=>down=null);canvas.addEventListener('dblclick',()=>safe(()=>{camera.yaw=.55;camera.pitch=.18;refresh();}));}
